name: Empatica client libraries and packages
description: >-
  Empatica publishes NO first-party client library on any public package
  registry today. npm, PyPI, Maven Central and the Empatica GitHub organization
  were all searched. Every package that carries the Empatica name is
  community-maintained, targets the discontinued E4 wristband, and has not been
  released in years. The first-party E4 SDKs (E4link for Android, EmpaLink for
  iOS) were distributed from developer.empatica.com, which was retired with the
  E4 on 2025-02-14 and now serves only a redirect to the sunset notice — so the
  official SDK surface did not move to a registry, it disappeared.
