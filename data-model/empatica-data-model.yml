generated: '2026-08-12'
method: searched
source: https://support.empatica.com/hc/en-us/articles/17727336158365-Raw-data-in-the-Empatica-Cloud
docs:
- https://support.empatica.com/hc/en-us/articles/17727336158365-Raw-data-in-the-Empatica-Cloud
- https://support.empatica.com/hc/en-us/articles/17405877853981-How-to-access-Avro-files-with-Python
