data_transfer_cadence:
  note: >-
    The nearest thing Empatica publishes to a throughput contract is not a rate limit
    but a delivery cadence — high-frequency raw data is uploaded to the Empatica Cloud
    every 30 minutes and lands in S3 as Avro files covering up to ~30 minutes each.
    S3 read throughput is governed by AWS, not by Empatica.
  source: https://support.empatica.com/hc/en-us/articles/17727336158365-Raw-data-in-the-Empatica-Cloud
gaps:
- No published limits for the Cloud API, which is sold to automated CTMS/EDC integrations
  that will poll it.
- No runtime signal of any kind, so a client cannot back off before being throttled and
  cannot tell throttling from failure.
