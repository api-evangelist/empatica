    status: sunset
    effective_date: '2025-02-14'
    announcement: https://www.empatica.com/research/e4-sunset/
    migration_target: EmbracePlus
    detail: >-
      "As of February 14th, 2025, the E4 and its software suite have officially been
      sunset." The E4 developer surface went with it — developer.empatica.com now
      302s to the sunset notice, and the empatica/empatica.github.io repository that
      served it contains only index.html, 404.html and a CNAME. Every first-party E4
      SDK and the E4 Connect/Realtime documentation are gone.
    x-evidence:
