        redirect notice to https://www.empatica.com/research/e4-sunset/}
    - {url: 'https://developer.empatica.com/openapi.json', http_status: 404}
    - {url: 'https://www.empatica.com/research/e4-sunset/', http_status: 200}
  - name: Embrace2
    status: no-longer-available-for-purchase
    announcement: https://www.empatica.com/embrace2/
    detail: Site navigation labels Embrace2 "No longer available for purchase"; support
      articles remain.
    method: searched
  assessment: >-
    A dated sunset notice with a named migration target is real deprecation
    communication, and it is why a Deprecation pointer is emitted. It is NOT a
    deprecation policy: there is no stated notice period, no support window, and no
    machine-readable Sunset/Deprecation header on any endpoint.
