name: Empatica lifecycle, versioning and deprecation posture
description: >-
  What Empatica publishes about versioning, deprecation and operational status.
  There is no API-level versioning policy or deprecation policy document; what
  does exist is a dated product sunset notice for the E4 platform and an
  Atlassian Statuspage covering the live services.
