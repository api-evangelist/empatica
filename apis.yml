aid: empatica
name: Empatica
description: 'Empatica Inc. is an MIT Media Lab spinoff, founded in Cambridge, Massachusetts,
  that builds FDA-cleared medical wearables — EmbracePlus, EmbraceMini and the EpiMonitor
  epilepsy monitoring system — together with the Empatica Health Monitoring Platform,
  a cloud platform for continuous, remote physiological data collection in clinical
  research and patient monitoring. The platform captures raw sensor streams (PPG/blood
  volume pulse, electrodermal activity, skin temperature, accelerometer, gyroscope,
  steps, systolic peaks, participant tags) and derives 300+ digital measures used as
  digital endpoints by pharmaceutical sponsors and CROs. Programmatic access is delivered
  three ways: a cloud-to-cloud Cloud API that pushes participant management, wearing
  compliance and digital biomarker data into a sponsor''s CTMS/EDC; an AWS S3 data
  bucket addressed with Care Portal-issued Data Access Keys, where high-frequency raw
  data lands every 30 minutes as Apache Avro files; and a live REST host at api.empatica.com
  backing Empatica''s own apps and portals. The Cloud API reference is issued only
  to contracted clients, so no OpenAPI, AsyncAPI or public API reference is published.'
