apis:
- aid: empatica-cloud-api
  name: Empatica Cloud API
  description: 'Cloud-to-cloud API that connects Empatica Health Monitoring Platform
    data to a sponsor''s or CRO''s own clinical trial systems in real time. Documented
    capabilities: participant onboarding from external systems using existing participant
    IDs, participant status management including early and full termination, wearing
    detection and compliance data, and access to raw and digital biomarker data delivered
    as CSV and Apache Avro. Announced September 2024. Empatica states that full developer
    documentation is provided to Cloud API clients only, so no public reference, base
    URL or machine-readable contract is published.'
  humanURL: https://www.empatica.com/cloud-api/
  tags:
  - Clinical Trials
  - Digital Biomarkers
  - Data Integration
  properties:
  - type: Documentation
    url: https://www.empatica.com/cloud-api/
  - type: Blog
    url: https://www.empatica.com/blog/cloud-api-revolutionizing-data-integration-for-clinical-trials/
- aid: empatica-platform-api
  name: Empatica Platform API (api.empatica.com)
  description: 'Live REST host observed at https://api.empatica.com/v2/ that backs
    Empatica''s mobile apps and web portals. Probed anonymously on 2026-08-12: POST
    /v2/login answers a JSON error envelope, GET /v2/users/me and /v2/devices require
    a bearer token, and the CORS preflight advertises the custom request headers x-emp-app-name,
    x-emp-app-version, x-emp-app-platform and elastic-apm-traceparent. Empatica publishes
    no public reference, OpenAPI or developer portal for this host — everything recorded
    here about it is probe evidence, not documentation.'
  humanURL: https://www.empatica.com/platform/home/
  baseURL: https://api.empatica.com/v2/
  tags:
  - REST
  - Undocumented
  properties:
