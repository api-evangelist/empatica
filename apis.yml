    url: authentication/empatica-authentication.yml
  - type: ErrorCatalog
    url: errors/empatica-error-codes.yml
  - type: RateLimits
    url: rate-limits/empatica-rate-limits.yml
- aid: empatica-cloud-data-access
  name: Empatica Cloud Data Access (S3)
  description: 'The primary programmatic data interface for the Empatica Health Monitoring
    Platform. High-frequency raw data from EmbracePlus is uploaded to the Empatica
    Cloud every 30 minutes and made available in an organization-scoped AWS S3 bucket
    (s3://bucket-name/version/dir-name/) as Apache Avro files named [participant_id]_[utc_timestamp_start].avro.
    Access is authorized with Data Access Keys — an AWS Access Key ID and Secret Access
    Key generated and revoked from the Data Access Keys page of the Care Portal, with
    a maximum of two active key sets per account. Any S3-capable client works: Cyberduck,
    AWS CLI v2, or the AWS SDKs.'
  humanURL: https://support.empatica.com/hc/en-us/articles/13879014347421-Accessing-Data-on-the-S3-Bucket
