    url: well-known/empatica-well-known.yml
- id: asyncapi-webhooks
  name: AsyncAPI / webhook event surface
  conforms: false
  evidence:
    type: search
    detail: No event, streaming or webhook surface is documented. A support-centre
      search for "webhook" returns zero articles.
- id: a2a-agent-card
  name: A2A Agent Card
  conforms: false
  evidence:
    type: probe
    detail: /.well-known/agent-card.json and /.well-known/agent.json miss on every host
      (404 on api and support; soft-404 HTML shell on www and care).
    url: well-known/empatica-well-known.yml
summary:
  regulatory_regimes: 8
  api_standards_conformant: 2
  api_standards_absent: 6
  note: >-
    Empatica clears an unusually high regulatory bar — MDSAP, EU MDR, ISO 13485, ISO/IEC
    27001 and eight FDA 510(k)s — and publishes verifiable certificate links for each.
    None of that reaches the API layer: no OpenAPI, no problem+json, no OAuth discovery,
    no security.txt, no event contract. The compliance posture and the interface posture
    are decoupled.
