    url: errors/empatica-error-codes.yml
- id: oauth2-oidc
  name: OAuth 2.0 / OpenID Connect
  conforms: false
  evidence:
    type: probe
    detail: No discovery document at /.well-known/openid-configuration or
      /.well-known/oauth-authorization-server on any host. Authentication is a
