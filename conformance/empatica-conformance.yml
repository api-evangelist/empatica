method: searched
source: https://www.empatica.com/legal/
name: Empatica standards and regulatory conformance
description: >-
  What Empatica claims and publishes evidence for. Empatica is a regulated medical
  device manufacturer, so its conformance surface is dominated by device and quality
  regimes rather than API standards — and that asymmetry is the finding: the
  certificate wall is extensive and independently verifiable, while conformance to
  any web-API or agent-interoperability standard is nil.
