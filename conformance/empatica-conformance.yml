- id: apache-avro
  name: Apache Avro 1.11.x data serialization
  conforms: true
  evidence:
    type: published data contract
    detail: >-
      Raw sensor data is delivered as self-describing Avro files carrying their own
      schema and sampling frequencies, with official reader APIs in Python, Java, C,
      C#, C++ and a MATLAB interface. This is the one genuinely open, machine-readable
      standard in Empatica's data path.
    url: https://support.empatica.com/hc/en-us/articles/17727336158365-Raw-data-in-the-Empatica-Cloud
