      api.empatica.com, www.empatica.com, care.empatica.com and developer.empatica.com.
    date: '2026-08-12'
- id: rfc9457
  name: RFC 9457 Problem Details for HTTP APIs
  conforms: false
  evidence:
    type: probe
    detail: 'Errors are returned as a custom envelope {status, statusText, errorCode,
