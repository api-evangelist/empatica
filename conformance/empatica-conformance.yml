    detail: Data is retrieved with any standard S3 client (Cyberduck, AWS CLI v2, AWS
      SDKs) using Empatica-issued access keys.
    url: https://support.empatica.com/hc/en-us/articles/13879014347421-Accessing-Data-on-the-S3-Bucket
